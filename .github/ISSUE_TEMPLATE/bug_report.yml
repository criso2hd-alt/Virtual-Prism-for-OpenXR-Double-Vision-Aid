name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: headset
    attributes: {label: Headset and connection, placeholder: "Quest 3 over Quest Link"}
    validations: {required: true}
  - type: input
    id: runtime
    attributes: {label: Active OpenXR runtime, placeholder: "Meta Quest Link / SteamVR / WMR"}
  - type: input
    id: game
    attributes: {label: Game or app where it happens}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Layer log (optional)
      description: "Contents of %APPDATA%\VirtualPrismOpenXR\layer.log"
