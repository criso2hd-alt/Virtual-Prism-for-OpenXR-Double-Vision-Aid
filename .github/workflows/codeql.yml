name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --target VirtualPrism
      - uses: github/codeql-action/analyze@v4
